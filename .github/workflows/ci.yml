name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            cloudfunctions/api/package-lock.json
      - run: npm ci --prefix admin
      - run: npm ci --prefix cloudfunctions/api
      - run: npm run prepare:functions
      - run: npm test
      - run: npm --prefix admin run build -- --emptyOutDir=false
      - name: Check JavaScript syntax
        run: git ls-files '*.js' | while IFS= read -r file; do node --check "$file"; done
      - run: git diff --check
      - name: Verify shared cloud modules are synchronized
        run: git diff --exit-code -- cloudfunctions/jobs/lib cloudfunctions/payment-callback/lib cloudfunctions/admin-api/lib cloudfunctions/seed/lib cloudfunctions/admin-api/api.js
